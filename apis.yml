name: OptoAtmospherics
description: OptoAtmospherics, Inc. is an Ann Arbor, Michigan company (founded 2009, spun out of Michigan
  Aerospace Corporation) that develops UV-based Light Detection and Ranging (LIDAR) systems for the wind
  energy industry. Its laser-based atmospheric measurement products deliver continuous wind speed, direction,
  temperature, and density reporting from turbine-mounted or ground-based platforms, with real-time detection
  of wind gusts, shear, and turbulence to improve site assessment, increase energy output, and protect
  turbine equipment. The business is a hardware and atmospheric-sensing venture; it exposes no public
  developer API, SDK, or software platform. Its former domain (optoatmospherics.com) is now parked/for-sale
  and the product line lives on under michiganaerospace.com/optoatmospherics/.
